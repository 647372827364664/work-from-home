<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        button {
            background: #5865F2;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #4752C4;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <h1>🧪 Discord Webhook Test</h1>
    <p>Click the button below to send a test message to your Discord channel.</p>

    <button onclick="testWebhook()">Send Test Message to Discord</button>

    <div id="result"></div>

    <script>
        async function testWebhook() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Sending test message...';
            resultDiv.className = '';

            const webhookUrl = 'https://discordapp.com/api/webhooks/1457315208031637616/BfDApClPQ180G59B9W9Jti5KNtZNAyfwQH3I9HGJzouMG_oHTkNxYlqO9WLto9y5CwLu';

            const testData = {
                username: 'Work From Home Bot',
                avatar_url: 'https://cdn-icons-png.flaticon.com/512/2991/2991148.png',
                embeds: [{
                    title: '🎯 Test Message - Webhook Working!',
                    description: 'This is a test message to verify your Discord webhook is configured correctly.',
                    color: 3447003,
                    fields: [
                        {
                            name: '✅ Status',
                            value: 'Webhook is active and ready to receive form submissions!',
                            inline: false
                        },
                        {
                            name: '📝 Next Steps',
                            value: 'Now integrate this code into your script.js file to start receiving real form submissions.',
                            inline: false
                        },
                        {
                            name: '🕐 Test Time',
                            value: new Date().toLocaleString('en-IN'),
                            inline: false
                        }
                    ],
                    footer: {
                        text: 'Test sent from Work From Home Lead Gen System'
                    },
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });

                if (response.ok) {
                    resultDiv.textContent = '✅ Success! Check your Discord channel - you should see the test message!';
                    resultDiv.className = 'success';
                } else {
                    const errorText = await response.text();
                    resultDiv.textContent = `❌ Error: ${response.status} - ${errorText}`;
                    resultDiv.className = 'error';
                }
            } catch (error) {
                resultDiv.textContent = `❌ Error: ${error.message}`;
                resultDiv.className = 'error';
            }
        }
    </script>
</body>

</html>
